<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar / Cadastro</title>
    <link rel="stylesheet" href="/frontend/estilos.css">
    <link rel="icon" type="image/png" href="/frontend/images/batman-seeklogo.png">
</head>
<body class="pagina-entrada">
    <img src="/frontend/images/batman-seeklogo.png" alt="Logo do Batman" class="logo">

    <!-- O login é sempre o primeiro formulário exibido -->
    <form id="formLogin">
        <h2>Entrar</h2>
        <input type="text" id="emailLogin" name="email" placeholder="Email" required>
        <input type="password" id="senhaLogin" name="senha" placeholder="Senha" required>

        <button type="submit">Entrar</button>
        <button type="button" class="botao-secundario" onclick="mostrarFormulario('cadastro')">Criar nova conta</button>
    </form>

    <!-- O cadastro aparece apenas para quem ainda não tem conta -->
    <form id="formCadastro" hidden>
        <h2>Criar nova conta</h2>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        <input type="text" id="emailCad" name="email" placeholder="Email" required>
        <input type="password" id="senhaCad" name="senha" placeholder="Crie uma senha" required>

        <button type="submit">Cadastrar</button>
        <button type="button" class="botao-secundario" onclick="mostrarFormulario('login')">Login</button>
    </form>

    <script src="frontend/scripts.js"></script>
</body>
</html>
